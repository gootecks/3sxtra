name: Build (macOS)

on:
    workflow_dispatch:
    pull_request:
        branches: [ "main" ]
    workflow_call:
        inputs:
            release:
                description: "Build in Release mode and produce release artifacts"
                required: false
                type: boolean
                default: false

concurrency:
    group: build-macos-universal-${{ github.ref }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    build:
        runs-on: macos-latest
        env:
            MACOSX_DEPLOYMENT_TARGET: "13.0"
            TARGET_ARCH: universal

        steps:
          - name: Checkout repository
            uses: actions/checkout@v6

          - name: Cache dependencies
            uses: actions/cache@v5
            with:
                path: third_party
                key: macos-universal-deps-v3-${{ hashFiles('build-deps.sh') }}
                restore-keys: macos-universal-deps-v3-

          - name: Cache Rust/Cargo
            uses: actions/cache@v5
            with:
                path: |
                    ~/.cargo/registry
                    ~/.cargo/git
                key: macos-cargo-v2-${{ hashFiles('build-deps.sh') }}
                restore-keys: macos-cargo-

          - name: Install Rust toolchain
            uses: dtolnay/rust-toolchain@stable
            with:
                targets: aarch64-apple-darwin,x86_64-apple-darwin

          - name: Install dependencies
            # Every native dependency (incl. miniupnpc) is built universal into third_party;
            # zlib comes from the macOS SDK. Only build tools come from Homebrew.
            run: |
                brew list ninja &>/dev/null || brew install ninja
                brew list shaderc &>/dev/null || brew install shaderc
                python3 -m pip install --break-system-packages jinja2
                bash build-deps.sh

          - name: Setup ccache
            uses: hendrikmuhs/ccache-action@v1.2.22
            with:
                key: macos-universal-ccache

          - name: Build and package universal app
            run: |
                set -o pipefail
                BUILD_TYPE=${{ inputs.release && 'Release' || 'Debug' }}
                PACKAGE_CMAKE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" \
                  tools/macos/package-engine.sh --arch universal --build-type "$BUILD_TYPE" \
                    --build-dir build --out dist/macos 2>&1 | tee build.log
            shell: bash

          - name: Upload release artifact
            if: ${{ inputs.release }}
            uses: actions/upload-artifact@v7
            with:
                name: release-assets-macos
                path: |
                    dist/macos/3SX-*-macos-universal.dmg
                    dist/macos/3SX-*-macos-universal.zip
                if-no-files-found: error

          - name: Save build log (local act)
            if: ${{ always() && env.ACT }}
            run: |
                mkdir -p $GITHUB_WORKSPACE/build_output
                cp build.log $GITHUB_WORKSPACE/build_output/build-log-macos.log
                echo "✅ Build log saved to build_output/build-log-macos.log"

          - name: Upload build log (GitHub)
            if: ${{ always() && !env.ACT && !inputs.release }}
            uses: actions/upload-artifact@v7
            with:
                name: build-log
                path: build.log
