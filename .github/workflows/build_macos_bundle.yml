name: Build macOS Bundle (3SXtra.app)

# Combines the universal launcher with the engine built by build_macos.yml.
# Must run in the same workflow run as build_macos.yml (needs its
# `release-assets-macos` artifact containing 3SX-<sha>-macos-universal.zip).

on:
    workflow_call:

jobs:
    bundle:
        runs-on: macos-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Download engine artifact
              uses: actions/download-artifact@v8
              with:
                  name: release-assets-macos
                  path: engine-artifact

            - name: Unpack engine
              run: |
                  set -euo pipefail
                  ZIP="$(ls engine-artifact/3SX-*-macos-universal.zip | head -n1)"
                  mkdir -p engine
                  ditto -x -k "$ZIP" engine
                  test -x engine/3sx.app/Contents/MacOS/3sx

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin,x86_64-apple-darwin

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Build 3SXtra.app
              run: tools/macos/package-bundle.sh --engine engine/3sx.app --out dist/macos

            - name: Upload release artifact
              uses: actions/upload-artifact@v7
              with:
                  name: release-assets-macos-bundle
                  path: |
                      dist/macos/3SXtra-*-macos-universal.zip
                      dist/macos/3SXtra-*-macos-universal.dmg
