name: Create Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build (Linux x86_64)
    uses: ./.github/workflows/build_linux.yml
    with:
      release: true

  build-linux-arm64:
    name: Build (Linux ARM64)
    uses: ./.github/workflows/build_linux_arm64.yml
    with:
      release: true

  build-windows:
    name: Build (Windows x86_64)
    uses: ./.github/workflows/build_windows.yml
    with:
      release: true

  build-macos:
    name: Build (macOS Universal)
    uses: ./.github/workflows/build_macos.yml
    with:
      release: true

  build-flatpak:
    name: Build (Flatpak)
    uses: ./.github/workflows/build_flatpak.yml
    with:
      release: true

  build-launcher:
    name: Build (Launcher)
    uses: ./.github/workflows/build_launcher.yml
    with:
      release: true

  package-assets:
    name: Package Assets
    uses: ./.github/workflows/package_assets.yml
    with:
      version: '1'

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-linux-arm64, build-windows, build-macos, build-flatpak, build-launcher, package-assets]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Move rolling release tag
        env:
          TAG_NAME: rolling-pre-release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${TAG_NAME}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG_NAME}" --force

      - name: Write release notes
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${FULL_SHA:0:7}"

          cat > downloads.md <<EOF
          ### Downloads
          | Platform | Architecture | File |
          |----------|-------------|------|
          | Linux | x86_64 | \`3SX-${SHORT_SHA}-linux-x86_64.tar.gz\` |
          | Linux | ARM64 | \`3SX-${SHORT_SHA}-linux-arm64.tar.gz\` |
          | Windows | x86_64 | \`3SX-${SHORT_SHA}-windows.zip\` |
          | macOS | Universal (Apple Silicon + Intel) | \`3SX-${SHORT_SHA}-macos-universal.dmg\` |
          | macOS | Universal (Apple Silicon + Intel) | \`3SX-${SHORT_SHA}-macos-universal.zip\` |
          | Linux (Flatpak) | x86_64 | \`3sx.flatpak\` |
          | All | — | \`3SX-assets-v1-${SHORT_SHA}.zip\` |
          | **Launcher** | | |
          | Windows | x86_64 | \`3SX-Launcher-${SHORT_SHA}-windows.exe\` |
          | macOS | Universal | \`3SX-Launcher-${SHORT_SHA}-macos-universal\` |
          | Linux | x86_64 | \`3SX-Launcher-${SHORT_SHA}-linux-x86_64\` |
          | Linux | ARM64 | \`3SX-Launcher-${SHORT_SHA}-linux-arm64\` |

          macOS builds are ad-hoc signed (not notarised): on first launch right-click the app and choose **Open**,
          or run \`xattr -dr com.apple.quarantine 3sx.app\`.
          EOF

          { echo "Automatic release for commit ${FULL_SHA}"; echo
            echo "⚠️ **Disclaimer**: This is a __pre-release__ build. Expect bugs and instability."; echo
            cat downloads.md; } > notes-rolling.md
          { echo "Release ${GITHUB_REF_NAME} (commit ${FULL_SHA})"; echo; cat downloads.md; } > notes-tag.md

      - name: Create or update rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: rolling-pre-release
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${FULL_SHA:0:7}"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "${SHORT_SHA}" \
              --prerelease \
              --notes-file notes-rolling.md

            for asset in $(gh release view "${TAG_NAME}" --json assets --jq '.assets[].name'); do
              gh release delete-asset "${TAG_NAME}" "${asset}" --yes
            done

            gh release upload "${TAG_NAME}" release-assets/* --clobber
          else
            gh release create "${TAG_NAME}" release-assets/* \
              --title "${SHORT_SHA}" \
              --prerelease \
              --notes-file notes-rolling.md
          fi

      - name: Create or update tagged release
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --prerelease=false \
              --notes-file notes-tag.md
            gh release upload "${TAG_NAME}" release-assets/* --clobber
          else
            gh release create "${TAG_NAME}" release-assets/* \
              --verify-tag \
              --title "${TAG_NAME}" \
              --notes-file notes-tag.md
          fi


