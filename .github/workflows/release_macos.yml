name: Release (macOS)

# macOS-only release, independent of the other platforms (release.yml).
# Every run refreshes the `macos-rolling` pre-release, which the 3SXtra
# launcher's updater and FreeFighter install from. Pushing a `macos-v*` tag
# also publishes a release for that tag (a pre-release when the tag has a
# `-` suffix, e.g. macos-v0.1.0-rc.1).

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "macos-v*" ]

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-engine:
    name: Build (macOS Universal engine)
    uses: ./.github/workflows/build_macos.yml
    with:
      release: true

  build-bundle:
    name: Build (macOS 3SXtra.app)
    needs: build-engine
    uses: ./.github/workflows/build_macos_bundle.yml

  release:
    name: Publish macOS release
    runs-on: ubuntu-latest
    needs: [build-engine, build-bundle]
    env:
      GH_TOKEN: ${{ github.token }}
      ROLLING_TAG: macos-rolling
      FULL_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download macOS assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-macos*
          merge-multiple: true
          path: release-assets

      - name: Checksums and notes
        run: |
          set -euo pipefail
          SHORT_SHA="${FULL_SHA:0:7}"
          (cd release-assets && sha256sum -- * > SHA256SUMS.txt)
          ls -l release-assets

          cat > downloads.md <<EOF
          ### Downloads (macOS 13+, Apple Silicon and Intel)
          | What | File |
          |------|------|
          | **3SXtra.app**: launcher with the engine built in (recommended) | \`3SXtra-*-macos-universal.dmg\` / \`.zip\` |
          | 3sx.app: engine only | \`3SX-*-macos-universal.dmg\` / \`.zip\` |
          | Checksums | \`SHA256SUMS.txt\` |

          Bring your own \`SF33RD.AFS\` from a PS2 3rd Strike / Anniversary Collection disc; the launcher can find
          and import it from a mounted disc or ISO.

          Builds are ad-hoc signed, not notarised: on first launch right-click the app and choose **Open**,
          or run \`xattr -dr com.apple.quarantine /Applications/3SXtra.app\`.
          EOF

          { echo "Automatic macOS build of ${FULL_SHA} (${GITHUB_REF_NAME})."; echo
            echo "⚠️ Rolling pre-release: expect bugs."; echo
            cat downloads.md; } > notes-rolling.md
          { echo "macOS release ${GITHUB_REF_NAME} (commit ${FULL_SHA})."; echo; cat downloads.md; } > notes-tag.md

      - name: Update macos-rolling
        run: |
          set -euo pipefail
          SHORT_SHA="${FULL_SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${ROLLING_TAG}" "${FULL_SHA}"
          git push origin "refs/tags/${ROLLING_TAG}" --force

          if gh release view "${ROLLING_TAG}" >/dev/null 2>&1; then
            # Upload first, then prune, so the release never has zero assets.
            gh release upload "${ROLLING_TAG}" release-assets/* --clobber
            for asset in $(gh release view "${ROLLING_TAG}" --json assets --jq '.assets[].name'); do
              [[ -e "release-assets/${asset}" ]] || gh release delete-asset "${ROLLING_TAG}" "${asset}" --yes
            done
            gh release edit "${ROLLING_TAG}" --title "macOS ${SHORT_SHA}" --prerelease --notes-file notes-rolling.md
          else
            gh release create "${ROLLING_TAG}" release-assets/* \
              --title "macOS ${SHORT_SHA}" --prerelease --notes-file notes-rolling.md
          fi

      - name: Publish tagged release
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'macos-v') }}
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PRE=false
          [[ "${TAG_NAME}" == *-* ]] && PRE=true
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/* --clobber
            gh release edit "${TAG_NAME}" --title "${TAG_NAME}" --prerelease="${PRE}" --notes-file notes-tag.md
          else
            gh release create "${TAG_NAME}" release-assets/* --verify-tag \
              --title "${TAG_NAME}" --prerelease="${PRE}" --notes-file notes-tag.md
          fi
